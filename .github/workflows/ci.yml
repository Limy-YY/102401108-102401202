# 校园失物招领 —— 每日构建 / 提交门禁
# 流水线：安装依赖 → 单元测试 → 组件测试 → 构建 H5 → 安装浏览器 → E2E
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # 允许手动触发
  workflow_dispatch:

jobs:
  test:
    name: 单元 / 组件 / 构建 / E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 单元测试（node:test）
        run: npm test

      - name: 组件测试（Vitest + @vue/test-utils）
        run: npm run test:component

      - name: 构建 H5
        run: node scripts/run.js build

      - name: 安装 Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 端到端测试（Playwright）
        run: npx playwright test

      - name: 上传 Playwright 报告（失败时）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
