# 校园失物招领 —— 提交门禁
# 测试文件不在仓库内（仅本地运行），此处只做依赖安装 + H5 构建校验
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # 允许手动触发
  workflow_dispatch:

jobs:
  build:
    name: 构建 H5
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 构建 H5
        run: node scripts/run.js build
